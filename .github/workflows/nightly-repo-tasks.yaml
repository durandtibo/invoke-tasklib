# Nightly run of the tasks the repo ships to others but does not exercise
# in ci-*.yaml: `security.audit` (the dependency-review workflow only checks
# the diff of a pull request, not the locked tree) and the `shell` and
# `spelling` steps of `check.all`. Unlike the other `nightly-*` workflows,
# it checks the repo's source, not the published package, because the
# findings come from the locked dependencies and the vulnerability database,
# which change without any commit. The doctests and the docs build are
# already covered by ci-doctest.yaml.

name: Nightly Repo Tasks
on:
  schedule:
    - cron: "40 10 * * *" # run at 10:40 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      - name: Audit the locked dependencies
        run: |
          uv run inv security.audit

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      - name: Run the shell and spelling checks
        run: |
          uv run inv check.all --keep-going --only shell,spelling
