# Nightly run of the tasks the repo ships to others but does not exercise
# in ci-*.yaml: the `shell` and `spelling` steps of `check.all`. Unlike the
# other `nightly-` workflows, it checks the repo's source, not the
# published package. The dependency audit runs in security-audit.yaml, and
# the doctests and the docs build are already covered by ci-doctest.yaml.

name: Nightly Repo Tasks
on:
  schedule:
    - cron: "40 10 * * *" # run at 10:40 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      - name: Run the shell and spelling checks
        run: |
          inv check.all --keep-going --only shell,spelling
