# Dependency compatibility testing workflow.
# Tests the package with different versions of its dependencies.
# Ensures compatibility across supported dependency version ranges.

name: Dependency Compatibility (Source)
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Get the version bounds of the dependencies from
  # dev/config/package_versions.json.
  get-versions:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-versions.yaml

  # One job per dependency, driven by the matrix instead of a hardcoded
  # job, so a new dependency only needs to be added to pyproject.toml, to
  # dev/config/package_versions.json (kept up to date by
  # bot-generate-package-versions.yaml) and to this list. invoke-tasklib
  # has no optional dependencies: invoke is its only runtime dependency.
  test-dep:
    permissions:
      contents: read
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        package-name: ["invoke"]
    uses: ./.github/workflows/ci-test-code-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ inputs.test-matrix }}
