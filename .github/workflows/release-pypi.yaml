# PyPI package publishing workflow.
# Builds and publishes the package to PyPI when a new version tag is pushed
# (or manually, for a dev/pre-release version from main).
#
# Uses the composite actions from durandtibo/build-pypi-package-action,
# durandtibo/sign-pypi-package-action, and durandtibo/publish-pypi-package-action,
# which build (uv build + inv build-package), sign with Sigstore, and publish
# via PyPI Trusted Publishing (OIDC) - no PYPI_TOKEN secret needed. Requires a
# GitHub Environment named "pypi" configured as a PyPI Trusted Publisher for
# this project, with workflow filename "release-pypi.yaml".

name: Publish PyPI Package
on:
  workflow_dispatch: # Allow manual trigger
  push:
    tags:
      - "v*.*.*" # Trigger on version tags (e.g., v1.0.0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Manual runs are only allowed from main; tag pushes are always allowed.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Unlike a typical consumer of build-pypi-package-action, this repo's own
    # tasks.py imports invoke_tasklib itself, so it must be importable
    # before `inv build-package` can even load the task collection.
    # build-pypi-package-action's own astral-sh/setup-uv step always runs `uv venv
    # --clear`, unconditionally wiping any venv/install made in a prior
    # step - so a pip/editable install can't survive it. PYTHONPATH does
    # survive (it's a job-level env var, not part of the venv), and since
    # this is a plain src-layout package with no compiled parts, pointing
    # at src/ directly is enough to make it importable without installing.
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Build package
        uses: durandtibo/build-pypi-package-action@3781c7eb97f68448f70e67e386f03aac7f7be384 # ratchet:durandtibo/build-pypi-package-action@v0.0.2

  sign-and-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to attach signed artifacts to the GitHub release
      id-token: write # Required to sign artifacts with Sigstore using OIDC keyless signing
    steps:
      - name: Sign and release package
        uses: durandtibo/sign-pypi-package-action@5f8c22801ccd4af3d171e3e395fd44e40018f1f5 # ratchet:durandtibo/sign-pypi-package-action@v0.0.1

  publish:
    needs: [build, sign-and-release]
    # Only fail-closed on tag pushes: on a tag, publish must wait for
    # sign-and-release to succeed; on workflow_dispatch, sign-and-release is
    # skipped (not failed), so allow publish to proceed.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.sign-and-release.result == 'success' || needs.sign-and-release.result == 'skipped')
    # publish-pypi-package-action runs pypa/gh-action-pypi-publish, a Docker
    # container action, which requires a Docker daemon - ubuntu-slim doesn't
    # have one, so this job needs ubuntu-latest unlike the other jobs here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/invoke-tasklib/
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify checksums
        run: |
          cd dist && sha256sum --check SHA256SUMS && rm SHA256SUMS

      - name: Download signature bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: signatures
          path: dist/

      - name: Install uv
        if: startsWith(github.ref, 'refs/tags/')
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Verify Sigstore signatures
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uvx sigstore verify identity dist/*.tar.gz dist/*.whl \
            --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release-pypi.yaml@${{ github.ref }}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # ratchet:pypa/gh-action-pypi-publish@v1.14.2
