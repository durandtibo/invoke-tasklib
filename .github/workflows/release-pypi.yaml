# PyPI package publishing workflow.
# Builds and publishes the package to PyPI when a new version tag is pushed
# (or manually, for a dev/pre-release version from main).
#
# Uses the composite actions from durandtibo/pypi-release-action, which
# build (uv build + inv build-package), sign with Sigstore, and publish via
# PyPI Trusted Publishing (OIDC) - no PYPI_TOKEN secret needed. Requires a
# GitHub Environment named "pypi" configured as a PyPI Trusted Publisher for
# this project, with workflow filename "release-pypi.yaml". See
# https://github.com/durandtibo/pypi-release-action for details.
#
# pypi-release-action has no tagged release yet, so it is pinned to a commit
# SHA on main rather than a version tag.

name: Publish PyPI Package
on:
  workflow_dispatch: # Allow manual trigger
  push:
    tags:
      - "v*.*.*" # Trigger on version tags (e.g., v1.0.0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Manual runs are only allowed from main; tag pushes are always allowed.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Unlike a typical consumer of pypi-release-action, this repo's own
      # tasks.py imports invoke_tasklib itself, so it must be installed
      # (editable) before `inv build-package` can even load the task
      # collection. build-package's own `make install-invoke` only installs
      # bare invoke, not this project.
      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      - name: Build package
        uses: durandtibo/pypi-release-action/build-package@2221f05901d6235566929645f4fd5da0004ce644 # pypi-release-action@main

  sign-and-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # Required to attach signed artifacts to the GitHub release
      id-token: write # Required to sign artifacts with Sigstore using OIDC keyless signing
    steps:
      - name: Sign and release package
        uses: durandtibo/pypi-release-action/sign@2221f05901d6235566929645f4fd5da0004ce644 # pypi-release-action@main

  publish:
    needs: [build, sign-and-release]
    # Only fail-closed on tag pushes: on a tag, publish must wait for
    # sign-and-release to succeed; on workflow_dispatch, sign-and-release is
    # skipped (not failed), so allow publish to proceed.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.sign-and-release.result == 'success' || needs.sign-and-release.result == 'skipped')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/invoke-tasklib/
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Publish package to PyPI
        uses: durandtibo/pypi-release-action/publish@2221f05901d6235566929645f4fd5da0004ce644 # pypi-release-action@main
        with:
          workflow-filename: release-pypi.yaml
