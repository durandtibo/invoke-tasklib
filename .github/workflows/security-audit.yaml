# Dependency audit workflow.
# Checks the locked dependencies for known vulnerabilities with pip-audit,
# every week and on demand. Complements the dependency review of pull requests,
# which only looks at the dependencies that a pull request changes.

name: Dependency Audit
on:
  schedule:
    - cron: "30 6 * * 1" # Run every Monday at 6:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      # Exports the locked dependencies and audits them with pip-audit
      - name: Audit the locked dependencies
        run: |
          inv security.audit
