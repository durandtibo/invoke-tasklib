# Benchmark workflow. Runs performance benchmarks (src/invoke_tasklib/testing.py's
# benchmark task) nightly on its own schedule instead of gating every PR/push,
# since a benchmark regression isn't a merge blocker.

name: Benchmark
on:
  schedule:
    - cron: "20 9 * * *" # Run nightly at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      # The results of the previous runs are kept in a cache, so each run is
      # compared with the last one and fails on a slowdown of more than 50%.
      - name: Restore the previous results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: .benchmarks
          key: benchmark-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            benchmark-${{ runner.os }}-

      - name: Run benchmarks
        run: |
          uv run inv test.benchmark --args "--benchmark-autosave --benchmark-compare --benchmark-compare-fail=mean:50%"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: benchmarks
          path: .benchmarks
          if-no-files-found: ignore
