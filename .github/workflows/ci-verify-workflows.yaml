# Workflow validation workflow.
# Verifies GitHub Actions workflow files are valid and follow best practices
# (action pinning, etc). Triggers on changes to workflow/action files so it
# doesn't need to run on every PR/push.

name: Verify Workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  verify-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Verify GitHub Workflows
        uses: durandtibo/verify-github-workflow-action@e5dc341675711838a82b2433f70a225858ad70d1 # ratchet:durandtibo/verify-github-workflow-action@v0.0.3
