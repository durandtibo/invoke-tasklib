# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
#
# Deliberately NOT called from here, each standalone with its own trigger:
#   - ci-benchmark.yaml: runs nightly on its own schedule instead of gating
#     every PR/push, since a benchmark regression isn't a merge blocker.
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself, so it
#     triggers on workflow-file changes rather than every PR/push.
# See .github/GUIDELINES.md for the naming/prefix and runs-on/timeout
# conventions shared across every workflow in this directory.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-build.yaml, ci-format.yaml, ...) instead of inlining their steps here,
# so each check can still be run/tested on its own (workflow_dispatch) and to
# keep this file short. Job ids are load-bearing: main's branch protection
# should require status checks named "format / format", "lint / lint",
# "type-checking / type-checking", etc., derived from the job id here plus
# the job id in the called workflow - keep both in sync if either is renamed.

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from
  # durandtibo/workflow-config-action's default config once, and pass it
  # down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Validate the package can be built and installed correctly
  build:
    uses: ./.github/workflows/ci-build.yaml

  # Verify code formatting (ruff, docstrings, shell)
  format:
    uses: ./.github/workflows/ci-format.yaml

  # Check code linting with ruff
  lint:
    uses: ./.github/workflows/ci-lint.yaml

  # Check type annotations with pyright
  type-checking:
    uses: ./.github/workflows/ci-type-checking.yaml

  # Run pre-commit hooks for code quality
  pre-commit:
    uses: ./.github/workflows/ci-pre-commit.yaml

  # Run doctests on code examples
  doctest:
    uses: ./.github/workflows/ci-doctest.yaml
    secrets: inherit

  # Run unit/integration/functional tests across Python versions and OS.
  # secrets: inherit is required so coverage can be uploaded to Codecov.
  test:
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    secrets: inherit

  # Run unit tests against every supported version of invoke (the one
  # runtime dependency), from its pyproject.toml lower bound to latest.
  test-deps:
    needs: get-matrix
    uses: ./.github/workflows/ci-test-deps.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
