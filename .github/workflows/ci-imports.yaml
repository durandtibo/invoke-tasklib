# Import-graph workflow.
# Imports every invoke_tasklib module in isolation to catch circular-import
# regressions (the `check_cycles` task of src/invoke_tasklib/imports.py),
# and checks the layering contracts of [tool.importlinter] in pyproject.toml.

name: Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  imports:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      - name: Check cyclic imports
        run: |
          inv imports.check-cycles

      # grimp (import-linter) does not build on free-threaded Python, so the
      # dev group only has it on Python 3.14 and later.
      - name: Check import contracts
        run: |
          lint-imports
