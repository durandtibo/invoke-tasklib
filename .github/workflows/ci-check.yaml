# Composite check workflow. Maps to src/invoke_tasklib/check.py's all task
# with its default steps, run the way a user of the library runs it: if a
# step is renamed or a tool list is wrong, it fails here and not a day later
# in the nightly job.

name: Check
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      - name: Run all the checks
        run: |
          uv run inv check.all --keep-going
