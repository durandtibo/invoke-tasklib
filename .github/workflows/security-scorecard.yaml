# OSSF Scorecard supply-chain security workflow.
# Runs the Scorecard analysis and publishes results to the OpenSSF badge API
# and GitHub's code-scanning dashboard.
# This workflow uses actions that are not certified by GitHub. They are
# provided by a third party and are governed by separate terms of service,
# privacy policy, and support documentation.

name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: "45 5 * * 2"
  push:
    branches: ["main"]
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
    steps:
      # Needed for the Branch-Protection check, which requires a token with
      # administration:read access to read classic branch protection rules.
      # Falls back to the default GITHUB_TOKEN (Branch-Protection check will
      # simply be skipped/inconclusive) until a GitHub App is configured -
      # see .github/GUIDELINES.md follow-ups.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ vars.TIBOT_APP_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # ratchet:ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Publish results to the OpenSSF REST API / badge for public repos;
          # always false for private repos regardless of this setting.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # ratchet:github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: results.sarif
