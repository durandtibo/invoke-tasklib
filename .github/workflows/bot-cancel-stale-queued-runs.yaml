# Cancels stale queued workflow runs hourly to prevent resource waste and
# reduce queue congestion.

name: Cancel Stale Queued Runs

on:
  schedule:
    - cron: "0 * * * *" # runs every hour
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Cancel queued runs older than this many hours"
        required: false
        default: "24"
        type: string

permissions: {}

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: durandtibo/cancel-queued-runs-action@3f57ce49d16e0e14e7dd4aed984ff77470d8e357 # ratchet:durandtibo/cancel-queued-runs-action@v1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          # Scheduled runs have no inputs, so fall back to 24 hours.
          max_age_hours: ${{ inputs.max_age_hours || '24' }}
