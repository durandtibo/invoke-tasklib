# Regenerates dev/config/package_versions.json (invoke's tested version list,
# used by ci-test-deps.yaml / nightly-test-package-dep.yaml) weekly and opens
# a PR when new invoke releases change the list.

name: Generate Package Versions

on:
  schedule:
    - cron: "0 6 * * 4" # Run every Thursday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  generate-package-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup python environment
        uses: ./.github/actions/setup-uv-env

      - name: Generate package versions
        run: uv run python dev/generate_versions.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/versions
          title: Generate package versions
          commit-message: "Generate package versions"
          body: Generate package versions.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
