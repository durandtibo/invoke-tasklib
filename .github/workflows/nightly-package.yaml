# Nightly dispatcher: tests the published PyPI package (stable + pre-release)
# against every supported Python version / OS, to catch issues from external
# changes (e.g. a new Python release) independent of the repo's source.
# No `*-extras` job, unlike upstream coola: invoke-tasklib has no optional
# dependencies / [project.optional-dependencies] extras to test. It does have
# a `*-dep` job (below), scoped to invoke, its one runtime dependency.

name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install invoke-tasklib"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre invoke-tasklib"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  deps:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
