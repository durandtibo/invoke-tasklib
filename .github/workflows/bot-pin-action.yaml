# Pins GitHub Actions in workflow files and composite actions to immutable
# commit SHAs using ratchet (https://github.com/sethvargo/ratchet).
# Opens a PR with the pinned actions after validation.
#
# Every action reference in this repo is already hand-pinned with a trailing
# `# ratchet:owner/repo@vX.Y.Z` comment, so on first run this job should have
# nothing to do; it exists to keep new/updated action references pinned
# going forward.

name: Pin GitHub Actions

on:
  schedule:
    - cron: "0 8 * * 3" # Run every Wednesday at 8:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install ratchet
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # ratchet:jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: sethvargo/ratchet
          platform: linux
          arch: amd64
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Pin GitHub Actions
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          shopt -s nullglob
          ratchet pin .github/workflows/*.yaml .github/workflows/*.yml \
            .github/actions/*/action.yaml .github/actions/*/action.yml

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/pin-action
          title: Pin GitHub Actions to commit SHA
          commit-message: "Pin GitHub Actions to commit SHA"
          body: Pin GitHub Actions to their commit SHA using ratchet.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
