# Linting workflow.
# Runs the `check_python` task of src/invoke_tasklib/lint.py
# (ruff check --output-format=github).

name: Lint
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      # Check the Python files with ruff
      - name: Check lint
        run: |
          inv lint.check-python
