[build-system]
requires = ["hatchling >= 1.32"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]

[project]
name = "invoke-tasklib"
version = "0.0.8"
description = "Reusable Invoke tasks shared across Python projects."
readme = "README.md"
authors = [{ name = "Thibaut Durand", email = "durand.tibo+gh@gmail.com" }]
keywords = ["invoke", "tasks", "automation", "devtools"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

requires-python = ">=3.11"
dependencies = ["invoke>=3.0,<4.0"]

[dependency-groups]
dev = [
  "codespell>=2.4,<3.0",
  "coverage[toml]>=7.17.0,<8.0",
  "docformatter>=1.7.8,<2.0",
  "feu[all]>=0.8.4,<1.0",
  "invoke>=3.0,<4.0",
  "pip-audit>=2.10,<3.0",
  "pre-commit>=4.6,<5.0",
  "pygments>=2.20,<3.0",
  "pytest-benchmark>=5.0,<6.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-timeout>=2.4,<3.0",
  "pytest>=9.1,<10.0",
  "pyright>=1.1.414,<2.0",
  "ruff>=0.16,<1.0",
  "ty>=0.0.96,<1.0",
  "xdoctest>=1.3,<2.0",
]
docs = [
  "mike >=2.2,<3.0",
  "mkdocs-material >=9.7,<10.0",
  "mkdocstrings[python]>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/durandtibo/invoke-tasklib"
Repository = "https://github.com/durandtibo/invoke-tasklib"
Documentation = "https://durandtibo.github.io/invoke-tasklib/"
Changelog = "https://github.com/durandtibo/invoke-tasklib/releases"
Issues = "https://github.com/durandtibo/invoke-tasklib/issues"

[tool.codespell]
skip = "*.lock,./.git,./htmlcov,./docs/site,coverage.xml"
ignore-regex = "re-declared|\\btha\\.\\.\\."
ignore-words-list = "caf"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["invoke_tasklib"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
  "\\)( -> .+)?: \\.\\.\\.$",
]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests/"]
addopts = [
  "--color",
  "yes",
  "--durations",
  "10",
  "-rf",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
timeout = 300
filterwarnings = ["error"]
# Configuration of the short test summary info
# https://docs.pytest.org/en/stable/usage.html#detailed-summary-report

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
syntax = "google"

[tool.ruff]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.select = [
  "A",    # builtins
  "ANN",  # annotations
  "ARG",  # flake8-unused-arguments
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (Error)
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # logging
  "N",    # naming
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (Warning)
]
lint.ignore = [
  "A003",    # Class attribute `{name}` is shadowing a python builtin
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed.
  "PLR0913", # Too many arguments in function definition (8 > 5)
  "PLR2004", # Magic value used in comparison, consider replacing 0.0 with a constant variable

  # The following rules are ignored because they conflict with another library like docformatter.
  "D102", # Missing docstring in public method
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in `__init__`
  "D205", # 1 blank line required between summary line and description
  "D209", # Multi-line docstring closing quotes should be on a separate line
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = [
  "A",    # builtins
  "ANN",  # annotations
  "ARG",  # flake8-unused-arguments
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (Error)
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # logging
  "N",    # naming
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (Warning)
]
lint.unfixable = []

lint.exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Enable on top of the Google convention.
lint.extend-select = ["D400", "D401", "D404"]

line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = [
  "D",    # pydocstyle
  "S101", # flake8-bandit: assert
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
known-first-party = ["invoke_tasklib"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"

[tool.ty.src]
include = ["src", "tests", "dev"]

[tool.ty.environment]
python-version = "3.11"
